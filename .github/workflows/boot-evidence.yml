name: Boot evidence verifier

on:
  pull_request:
    paths:
      - "scripts/verify-boot-evidence*.mjs"
      - "src/lib/upi/agent-boot-mirror*.ts"
      - "src/runtime/boot-state/**/*.ts"
      - "src/runtime/host-attestation/**/*.ts"
      - "src/runtime/grants/**/*.ts"
      - "migrations/0004_runtime_grants.sql"
      - "migrations/0003_host_attestations.sql"
      - "src/runtime/grants/**/*.ts"
      - "migrations/0004_runtime_grants.sql"
      - "migrations/0002_boot_runtime.sql"
      - "migrations/0002_boot_runtime.sql"
      - "docs/BOOT_EVIDENCE_CHECK.md"
      - "docs/REMOTE_DNA_HARD_ADMISSION_GATE.md"
      - "package.json"
      - ".github/workflows/boot-evidence.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-boot-evidence*.mjs"
      - "src/lib/upi/agent-boot-mirror*.ts"
      - "src/runtime/boot-state/**/*.ts"
      - "migrations/0002_boot_runtime.sql"
      - "docs/BOOT_EVIDENCE_CHECK.md"
      - "docs/REMOTE_DNA_HARD_ADMISSION_GATE.md"
      - "package.json"
      - ".github/workflows/boot-evidence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/verify-boot-evidence.mjs
      - run: node --test scripts/verify-boot-evidence.test.mjs
      - run: node --experimental-strip-types --test src/lib/upi/agent-boot-mirror.test.ts src/runtime/boot-state/state-machine.test.ts src/runtime/boot-state/postgres-repository.test.ts src/runtime/host-attestation/verifier.test.ts src/runtime/grants/postgres-grant-service.test.ts
      - run: node scripts/verify-persona-lock.mjs
      - run: node scripts/verify-remote-dna.mjs
