name: Boot evidence verifier

on:
  pull_request:
    paths:
      - "scripts/verify-boot-evidence*.mjs"
      - "src/lib/upi/agent-boot-mirror*.ts"
      - "docs/BOOT_EVIDENCE_CHECK.md"
      - "docs/REMOTE_DNA_HARD_ADMISSION_GATE.md"
      - "package.json"
      - ".github/workflows/boot-evidence.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-boot-evidence*.mjs"
      - "src/lib/upi/agent-boot-mirror*.ts"
      - "docs/BOOT_EVIDENCE_CHECK.md"
      - "docs/REMOTE_DNA_HARD_ADMISSION_GATE.md"
      - "package.json"
      - ".github/workflows/boot-evidence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/verify-boot-evidence.mjs
      - run: node --test scripts/verify-boot-evidence.test.mjs
      - run: node --experimental-strip-types --test src/lib/upi/agent-boot-mirror.test.ts
      - run: node scripts/verify-persona-lock.mjs
      - run: node scripts/verify-remote-dna.mjs
