name: Repository structure audit

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/**"
      - "docs/**"
      - "dna/**"
      - "persona/**"
      - "prompts/**"
      - "runtime/**"
      - "AGENTS.md"
      - "AGENTS.project.md"
      - ".devcontainer/**"
      - ".continue/rules/**"
      - ".continuity/INSTRUCTIONS.md"
      - ".cursorrules"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/copilot-instructions.md"
      - ".github/CODEOWNERS"
      - "README.md"
      - "startup.sh"
      - ".gitignore"
      - "WORKLOAD.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/repository-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "docs/**"
      - "dna/**"
      - "persona/**"
      - "prompts/**"
      - "runtime/**"
      - "AGENTS.md"
      - "AGENTS.project.md"
      - ".devcontainer/**"
      - ".continue/rules/**"
      - ".continuity/INSTRUCTIONS.md"
      - ".cursorrules"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/copilot-instructions.md"
      - ".github/CODEOWNERS"
      - "README.md"
      - "startup.sh"
      - ".gitignore"
      - "WORKLOAD.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/repository-audit.yml"

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/audit-repository.test.mjs scripts/startup.test.mjs
      - run: node scripts/audit-repository.mjs --summary
      - run: node scripts/verify-persona-lock.mjs
      - run: node scripts/verify-remote-dna.mjs
